# Contextos en los que un "municipio" NO es un lugar y debe conservarse.
# Se evalúan como regex sobre la ventana alrededor del match.
municipios_excepciones:
  - "ernesto gil\\s+trujillo"         # institución, no el municipio de Trujillo
  - "signo de\\s+bolivar"
  - "hospital\\s+de\\s+versalles"
